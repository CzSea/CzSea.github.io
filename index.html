<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>人设工坊 · 残烛海</title>
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <strong>人设工坊</strong>
        <span class="sub">残烛海 · 模板版</span>
      </div>
      <div class="ctas">
        <button id="btn-random" class="btn">随机示例</button>
        <button id="btn-download-all" class="btn ghost">导出全库（JSON）</button>
      </div>
    </header>

    <main class="main">
      <section class="panel form-panel">
        <h2>新建 / 编辑 人设</h2>
        <div class="grid">
          <label>角色名 <input id="input-name" placeholder="例：林月"></label>
          <label>关键词（逗号分隔） <input id="input-keywords" placeholder="冷静, 孤儿, 骑士"></label>
          <label>年龄 <input id="input-age" placeholder="例：28" type="number" min="0"></label>
          <label>性别 <input id="input-gender" placeholder="女 / 男 / 其他"></label>
          <label>职业 <input id="input-occupation" placeholder="游侠 / 侦探 / 学者"></label>
          <label>风格
            <select id="input-style">
              <option>写实</option><option>奇幻</option><option>现代浪漫</option><option>玄幻</option><option>悬疑</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="btn-generate" class="btn primary">生成人设</button>
          <button id="btn-save" class="btn">保存到本地库</button>
          <button id="btn-download-json" class="btn ghost">下载 JSON</button>
          <button id="btn-download-md" class="btn ghost">下载 Markdown</button>
          <button id="btn-print" class="btn ghost">打印 / 保存为 PDF</button>
        </div>
      </section>

      <section class="panel output-panel" id="output-section" aria-live="polite">
        <h2>生成结果</h2>
        <article id="narrative" class="narrative">点击“生成人设”查看结果。</article>

        <details class="json-box">
          <summary>结构化 JSON（可复制）</summary>
          <pre id="json-output"></pre>
        </details>
      </section>

      <section class="panel library-panel">
        <h2>本地人设库</h2>
        <div id="profiles-list" class="list">暂无已保存的人设。</div>
        <div class="hint">保存于浏览器（localStorage），换设备或清除浏览数据会丢失。若需云端保存可后续升级。</div>
      </section>
    </main>

    <footer class="footer">
      © 残烛海 · 人设工坊（模板） — 如需接入 AI 自动生成或云备份我可以代劳。
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
